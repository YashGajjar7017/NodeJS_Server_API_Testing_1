version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "21:21"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FTP_PORT=21
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/app/storage
      - DB_TYPE=mongodb
      - MONGODB_URI=mongodb://mongo:27017/fileserver
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=fileserver
    restart: unless-stopped

volumes:
  mongo_data: